<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mon bon — MonBonAgent</title>
<meta name="description" content="Votre bon d'achat MonBonAgent : code, QR code et instructions d'utilisation.">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Anton&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<link rel="stylesheet" href="/assets/gh-theme.css">
<link rel="stylesheet" href="/assets/components.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Montserrat",sans-serif;background:#f8f9fc;color:#212529;line-height:1.5}
a{color:inherit;text-decoration:none}
.container{max-width:760px;margin:0 auto;padding:0 20px}

nav{background:#fff;padding:14px 0;box-shadow:0 2px 10px rgba(15,10,48,.06);position:sticky;top:0;z-index:100}
nav .container{display:flex;align-items:center;justify-content:space-between}
.logo{font-family:"Anton",sans-serif;font-size:24px;color:var(--gh-bleu-cyan);letter-spacing:0.5px}
.logo span{color:var(--gh-bleu-iris)}
.nav-back{font-size:13px;color:#495057;display:inline-flex;align-items:center;gap:6px}
.nav-back:hover{color:var(--gh-bleu-cyan)}

main{padding:36px 0 60px}

/* Ticket premium look */
.ticket{background:#fff;border-radius:18px;box-shadow:0 12px 40px rgba(15,10,48,.10);overflow:hidden;margin-bottom:24px}
.ticket-top{background:linear-gradient(135deg,var(--gh-bleu-iris) 0%,#1c1750 100%);color:#fff;padding:34px 28px;text-align:center;position:relative}
.ticket-top .badge-success{display:inline-flex;align-items:center;gap:6px;background:rgba(212,237,218,.18);border:1px solid rgba(212,237,218,.4);color:#a3e9b3;padding:5px 14px;border-radius:999px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
.ticket-top h1{font-family:"Anton",sans-serif;font-size:28px;letter-spacing:.5px;margin-bottom:8px;line-height:1.15}
.ticket-top .merchant{font-size:15px;opacity:.92;display:flex;align-items:center;justify-content:center;gap:6px}
.ticket-top .merchant i{color:var(--gh-bleu-cyan)}
.ticket-top .value-badge{display:inline-block;background:var(--gh-bleu-cyan);color:#fff;font-family:"Anton",sans-serif;font-size:20px;letter-spacing:.5px;padding:8px 18px;border-radius:10px;margin-top:14px}
.ticket-top .value-badge small{font-family:"Montserrat",sans-serif;font-size:11px;text-transform:uppercase;opacity:.85;letter-spacing:.5px;display:block;font-weight:600}

.dashed{border-top:2px dashed #e0e3eb;position:relative;background:#fff}
.dashed::before,.dashed::after{content:"";position:absolute;top:-14px;width:26px;height:26px;background:#f8f9fc;border-radius:50%}
.dashed::before{left:-13px}.dashed::after{right:-13px}

.ticket-body{padding:30px 28px;text-align:center}
.qr-wrap{display:flex;justify-content:center;margin:6px 0 22px}
.qr-wrap canvas{border:2px solid #eef0f5;border-radius:14px;padding:14px;background:#fff}

.code-label{font-family:"Montserrat",sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#6c757d;margin-bottom:8px;font-weight:600}
.code{font-family:"Courier New",monospace;font-size:26px;font-weight:700;letter-spacing:4px;color:var(--gh-bleu-iris);background:#f1f3f7;padding:14px 22px;border-radius:12px;display:inline-block;margin-bottom:20px;border:2px dashed #ced4da}

.status{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:999px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.status.pending{background:#fef3c7;color:#92400e}
.status.paid{background:#d1fae5;color:#065f46}
.status.used{background:#e5e7eb;color:#374151}
.status.expired{background:#fee2e2;color:#991b1b}

.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:22px;text-align:left}
.info-cell{background:#f8f9fc;border-radius:10px;padding:12px 14px}
.info-cell .label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#6c757d;font-weight:600;margin-bottom:3px}
.info-cell .value{font-size:13.5px;color:#212529;font-weight:600}

.instructions{background:#eef3fa;border-left:4px solid var(--gh-bleu-cyan);padding:16px 18px;margin-top:24px;text-align:left;font-size:13.5px;border-radius:0 10px 10px 0;line-height:1.55}
.instructions strong{display:block;font-family:"Anton",sans-serif;font-size:16px;color:var(--gh-bleu-iris);letter-spacing:.3px;margin-bottom:6px}

.actions{margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:11px 22px;border-radius:10px;font-family:"Montserrat",sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;border:0;transition:all .18s;text-decoration:none}
.btn-primary{background:var(--gh-bleu-cyan);color:#fff}
.btn-primary:hover{background:var(--gh-bleu-cyan-hover)}
.btn-ghost{background:#fff;color:var(--gh-bleu-iris);border:1.5px solid #dee2e6}
.btn-ghost:hover{background:#f8f9fc;border-color:var(--gh-bleu-cyan);color:var(--gh-bleu-cyan)}
.btn-iris{background:var(--gh-bleu-iris);color:#fff}
.btn-iris:hover{background:#1c1750}

/* Social proof post-achat */
.post-purchase-proof{background:#fff;border-radius:16px;padding:20px 24px;text-align:center;margin-bottom:24px;box-shadow:0 4px 14px rgba(15,10,48,.05)}
.post-purchase-proof p{font-size:14px;color:#495057}
.post-purchase-proof strong{color:var(--gh-bleu-cyan);font-family:"Anton",sans-serif;font-size:18px;letter-spacing:.3px}

/* Cross-sell immo (post-conversion = moment haute attention) */
.immo-postcross{background:linear-gradient(135deg,var(--gh-bleu-iris) 0%,#1c1750 100%);color:#fff;border-radius:16px;padding:28px;margin-bottom:24px;text-align:center}
.immo-postcross .badge{display:inline-block;background:rgba(0,111,255,.18);color:var(--gh-bleu-cyan);padding:5px 14px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:14px;border:1px solid rgba(0,111,255,.35)}
.immo-postcross h3{font-family:"Anton",sans-serif;font-size:22px;letter-spacing:.3px;margin-bottom:8px}
.immo-postcross p{font-size:14px;opacity:.88;max-width:520px;margin:0 auto 18px}
.immo-postcross a{display:inline-flex;align-items:center;gap:8px;background:var(--gh-bleu-cyan);color:#fff;padding:12px 24px;border-radius:10px;font-family:"Montserrat",sans-serif;font-weight:600;font-size:14px;text-decoration:none;transition:background .18s}
.immo-postcross a:hover{background:var(--gh-bleu-cyan-hover)}

.err{background:#fff;border-radius:16px;padding:50px 30px;text-align:center;color:#6c757d;box-shadow:0 4px 14px rgba(15,10,48,.05)}
.err i{font-size:46px;color:#ced4da;margin-bottom:12px}
.err h1{font-family:"Anton",sans-serif;color:var(--gh-bleu-iris);font-size:26px;margin-bottom:8px;letter-spacing:.3px}
.err p{margin-bottom:18px}

footer{background:var(--gh-bleu-iris);color:#fff;padding:36px 0 22px;text-align:center;font-size:13px}
footer a{color:rgba(255,255,255,.75)}
footer a:hover{color:var(--gh-bleu-cyan)}
@media print{nav,footer,.actions,.immo-postcross,.post-purchase-proof,.immo-soft-bar{display:none}body{background:#fff}main{padding:0}.ticket{box-shadow:none;border:1px solid #ddd}}
@media (max-width:600px){.ticket-top{padding:26px 20px}.ticket-body{padding:22px 18px}.code{font-size:20px;letter-spacing:3px;padding:11px 16px}}
</style>
</head>
<body>

<nav>
  <div class="container">
    <a href="/" class="logo">Mon<span>BonAgent</span></a>
    <a class="nav-back" href="/"><i class="fas fa-chevron-left"></i> Accueil</a>
  </div>
</nav>

<main>
  <div class="container" id="main">
    <div class="err" id="loading"><i class="fas fa-spinner fa-spin"></i><h1>Chargement…</h1><p>Récupération de votre bon d'achat.</p></div>
  </div>
</main>

<aside class="immo-soft-bar" id="immo-soft-bar">
  <div class="immo-soft-bar-text">
    <i class="fas fa-house"></i>
    <span>Propriétaire ? <strong>Estimez votre bien gratuitement</strong> avec votre agent local Guy Hoquet.</span>
  </div>
  <a class="immo-soft-bar-cta" href="https://estime66.vercel.app?utm_source=monbonagent&utm_medium=immo_bar&utm_campaign=cross_sell" target="_blank" rel="noopener">
    <i class="fas fa-calculator"></i> Estimer mon bien
  </a>
  <button class="immo-soft-bar-close" aria-label="Fermer">✕</button>
</aside>

<footer>
  <div class="container">© 2026 MonBonAgent — Nordine Mouaouia, agent Guy Hoquet Perpignan · <a href="/footer-page.html">Mentions légales</a></div>
</footer>

<script src="/assets/components.js"></script>
<script>
var SUPABASE_URL='https://rvknysmuuusygowwauar.supabase.co';
var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2a255c211dXVzeWdvd3dhdWFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NTc0OTYsImV4cCI6MjA5MTMzMzQ5Nn0._X2KohbYZIqn_1d4bf0tlbimlNAKHflmUCW-vbj1yTg';
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function fmtDate(iso){if(!iso)return'';var d=new Date(iso);return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});}
function esc(s){return(s==null?'':String(s)).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);});}
function statusLabelFor(s){return({pending:'En attente',paid:'Réservé',used:'Utilisé',expired:'Expiré',refunded:'Remboursé'}[s])||s;}
function statusIcon(s){return({pending:'fa-hourglass-half',paid:'fa-check-circle',used:'fa-circle-check',expired:'fa-circle-xmark',refunded:'fa-rotate-left'}[s])||'fa-circle';}

(async function(){
  var mainEl=document.getElementById('main');
  var p=new URLSearchParams(location.search);
  var code=p.get('code');
  if(!code){
    mainEl.innerHTML='<div class="err"><i class="fas fa-link-slash"></i><h1>Code manquant</h1><p>Ce lien ne contient pas de code de bon.</p><a class="btn btn-primary" href="/">Retour à l\'accueil</a></div>';
    return;
  }
  var r=await sb.from('voucher_purchases').select('*').eq('code',code).maybeSingle();
  if(r.error||!r.data){
    mainEl.innerHTML='<div class="err"><i class="fas fa-search"></i><h1>Bon introuvable</h1><p>Ce bon n\'existe pas ou a été retiré.</p><a class="btn btn-primary" href="/">Retour à l\'accueil</a></div>';
    return;
  }
  var v=r.data;
  var mr=v.merchant_id?await sb.from('merchants').select('name,category,address,phone,slug').eq('id',v.merchant_id).maybeSingle():{data:null};
  var m=mr.data||{};
  var or=v.offer_id?await sb.from('offers').select('title,description,qr_config,price,gift').eq('id',v.offer_id).maybeSingle():{data:null};
  var o=or.data||{};

  // social proof : bons utilisés ce mois sur ce commerçant
  var soldCount=0;
  if(v.merchant_id){
    var since=new Date();since.setDate(1);
    var sr=await sb.from('voucher_purchases').select('id',{count:'exact',head:true}).eq('merchant_id',v.merchant_id).in('status',['paid','used']).gte('created_at',since.toISOString());
    soldCount=sr.count||0;
  }

  var valUrl=location.origin+'/validate.html?code='+encodeURIComponent(v.code);
  var html=''+
    (v.status==='paid'||v.status==='pending'
      ? '<div class="post-purchase-proof"><p><strong>'+ (soldCount||1) +'</strong> bons réservés chez '+ esc(m.name||'ce commerçant') +' ce mois-ci. Bonne pioche.</p></div>'
      : '')+
    '<div class="ticket">'+
      '<div class="ticket-top">'+
        '<span class="badge-success"><i class="fas '+statusIcon(v.status)+'"></i> '+esc(statusLabelFor(v.status))+'</span>'+
        '<h1>'+esc(o.title||o.description||'Bon d\'achat')+'</h1>'+
        '<div class="merchant"><i class="fas fa-store"></i> '+esc(m.name||'Commerce partenaire')+'</div>'+
        (v.amount?'<div class="value-badge">'+Number(v.amount).toFixed(0)+' €<small>'+ (v.gift?'+ '+Number(v.gift).toFixed(0)+' € offerts':'payés')+'</small></div>':'')+
      '</div>'+
      '<div class="dashed"></div>'+
      '<div class="ticket-body">'+
        '<div class="qr-wrap"><canvas id="qrc"></canvas></div>'+
        '<div class="code-label">Code de validation</div>'+
        '<div class="code">'+esc(v.code)+'</div>'+
        '<div class="info-grid">'+
          '<div class="info-cell"><div class="label">Acheteur</div><div class="value">'+esc(v.buyer_name||v.buyer_email||'—')+'</div></div>'+
          '<div class="info-cell"><div class="label">Date d\'achat</div><div class="value">'+esc(fmtDate(v.created_at))+'</div></div>'+
          (v.expires_at?'<div class="info-cell"><div class="label">Valable jusqu\'au</div><div class="value">'+esc(fmtDate(v.expires_at))+'</div></div>':'')+
          (v.used_at?'<div class="info-cell"><div class="label">Utilisé le</div><div class="value">'+esc(fmtDate(v.used_at))+'</div></div>':'')+
          (m.address?'<div class="info-cell" style="grid-column:1/-1"><div class="label">Adresse du commerce</div><div class="value">'+esc(m.address)+'</div></div>':'')+
        '</div>'+
        '<div class="instructions"><strong>Comment utiliser votre bon</strong>'+esc((o.qr_config&&o.qr_config.instructions)||'Présentez ce bon (sur votre téléphone ou imprimé) au commerçant partenaire. Il scannera le QR code ou saisira le code pour valider votre bon.')+'</div>'+
        '<div class="actions">'+
          '<button class="btn btn-primary" onclick="window.print()"><i class="fas fa-print"></i> Imprimer</button>'+
          (m.slug?'<a class="btn btn-iris" href="/commerce.html?slug='+esc(m.slug)+'"><i class="fas fa-store"></i> Voir le commerce</a>':'')+
          '<a class="btn btn-ghost" href="/commerces.html"><i class="fas fa-th"></i> Autres bons</a>'+
        '</div>'+
      '</div>'+
    '</div>'+
    /* Cross-sell immo post-achat (moment de haute attention positive) */
    '<div class="immo-postcross">'+
      '<span class="badge">Service partenaire · Guy Hoquet</span>'+
      '<h3>Vous êtes propriétaire à Elne ?</h3>'+
      '<p>Comme '+ (soldCount||12) +' voisins ce mois, vous venez de réserver votre bon. Nordine Mouaouia, votre agent local Guy Hoquet, vous offre <strong>l\'estimation gratuite et confidentielle de votre bien</strong> en moins de 24 h.</p>'+
      '<a href="https://estime66.vercel.app?utm_source=monbonagent&utm_medium=voucher_page&utm_campaign=post_purchase" target="_blank" rel="noopener"><i class="fas fa-calculator"></i> Estimation gratuite</a>'+
    '</div>';

  mainEl.innerHTML=html;
  QRCode.toCanvas(document.getElementById('qrc'),valUrl,{width:200,margin:1,color:{dark:'#0f0a30',light:'#ffffff'}},function(e){if(e)console.log(e);});
})().catch(function(err){
  console.error(err);
  document.getElementById('main').innerHTML='<div class="err"><i class="fas fa-triangle-exclamation"></i><h1>Erreur de chargement</h1><p>Réessayez dans un instant.</p><a class="btn btn-primary" href="/">Retour à l\'accueil</a></div>';
});
</script>
</body>
</html>
